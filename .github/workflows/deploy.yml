
name: Deploy IEM FedCup Backend

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PM2 if Missing
        run: |
          if ! command -v pm2 >/dev/null 2>&1; then
            npm install -g pm2
          fi

      - name: Stop Existing Backend
        run: |
          pm2 delete iem-fedcup-backend || true

          if command -v fuser >/dev/null 2>&1; then
            if sudo fuser -s 4000/tcp; then
              sudo fuser -k 4000/tcp || true
            fi
          fi

          sleep 3

      - name: Clean Previous Deployment
        run: |
          sudo mkdir -p /var/www/iem-fedcup-backend
          sudo rm -rf /var/www/iem-fedcup-backend/*
          sudo rm -rf /var/www/iem-fedcup-backend/.[!.]*

          sudo chown -R "$USER":"$(id -gn)" /var/www/iem-fedcup-backend

      - name: Copy Application Files
        run: |
          cp -a "$GITHUB_WORKSPACE/." /var/www/iem-fedcup-backend/

      - name: Install Production Dependencies
        working-directory: /var/www/iem-fedcup-backend
        run: |
          npm ci --omit=dev

      - name: Validate Application
        working-directory: /var/www/iem-fedcup-backend
        run: |
          node --check src/index.js

      - name: Start Backend with PM2
        working-directory: /var/www/iem-fedcup-backend
        env:
          NODE_ENV: production
          PORT: 4000

          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}

          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}

        run: |
          pm2 start npm --name iem-fedcup-backend -- start
          pm2 save

      - name: Verify Backend Health
        run: |
          sleep 5

          pm2 status

          curl --fail \
            --retry 5 \
            --retry-delay 3 \
            http://127.0.0.1:4000/api/health

      - name: Deployment Complete
        run: |
          echo "Backend deployment completed successfully."
          pm2 describe iem-fedcup-backend
